<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web site</title>
    <link rel ="stylesheet" href="./resource/reset.css">
    <link rel ="stylesheet" href="./resource/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
</head>

<body>
  
      <h1>Settings</h1>
      <div class="wrapper">
      <a href="#" class="nav-link">All settings</a>
      <a href="#" class="nav-link">Published</a>
      <a href="#" class="nav-link">BTC</a>
      <a href="#" class="nav-link">USDT</a>
      <a href="#" class="nav-link">TON</a>
      </div>
      <table class="table">
  <thead>
    <tr>
      <th>Setting name</th>
      <th>Status</th>
      <th>Delete</th>
    </tr>
  </thead>
  <tbody>
    <tr class="table-elem">
      <td><a href="#"class="table-link">BTC</a></td>
      <td class="status"><span class="draft">Draft</span></td>
      <td class="delete-icon"><img src="Icon-remove.svg" alt="delete"></td>
    </tr>
    <tr class="table-elem">
      <td><a href="#"class="table-link">USDT</a></td>
      <td class="status"><span class="active">Active</span></td>
      <td class="delete-icon"><img src="Icon-remove.svg" alt="delete"></td>
    </tr>
    <tr class="table-elem">
      <td><a href="#"class="table-link">TON</a></td>
      <td class="status"><span class="active">Active</span></td>
      <td class="delete-icon"><img src="Icon-remove.svg" alt="delete"></td>
    </tr>
  </tbody>
</table>
</body>
</html>
